<!DOCTYPE html>
<html>
<head>
  <title>iframe Permission Test</title>
</head>
<body>
  <h2>With permissions (should work):</h2>
  <iframe
    src="https://webcamtests.com"
    allow="camera; microphone"
    width="100%"
    height="500px"
    style="border:2px solid green"
  ></iframe>

  <h2>Without permissions (will fail):</h2>
  <iframe
    src="https://webcamtests.com"
    width="100%"
    height="500px"
    style="border:2px solid red"
  ></iframe>
</body>
</html>
